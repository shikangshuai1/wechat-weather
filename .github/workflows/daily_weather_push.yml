name: 每日天气推送 - 新乡

on:
  schedule:
    # 每天北京时间 07:00（UTC 23:00）
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '推送模式'
        required: false
        default: 'morning'
        type: choice
        options:
          - morning

jobs:
  weather_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 获取天气数据并生成 AI 内容
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python ai_content_generator.py

      - name: 发送推送
        id: send_push
        env:
          SEND_KEY: ${{ secrets.SEND_KEY }}
        run: |
          python push_to_wechat.py

      - name: 显示结果
        if: always()
        run: |
          echo "=== 天气数据 ==="
          cat weather_data.json 2>/dev/null || echo "无天气数据"
          echo ""
          echo "=== AI 内容 ==="
          cat ai_content.json 2>/dev/null || echo "无 AI 内容"
          echo ""
          echo "=== 推送结果 ==="
          cat push_result.json 2>/dev/null || echo "无推送结果"
          if [ -f error.log ]; then
            echo "=== 错误信息 ==="
            cat error.log
          fi
